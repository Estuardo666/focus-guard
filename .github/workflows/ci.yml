name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Run full validation
        shell: pwsh
        run: ./scripts/ci.ps1
      - name: Upload coverage and validation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focusguard-validation
          path: artifacts/
