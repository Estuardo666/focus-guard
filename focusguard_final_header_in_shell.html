<div style="font-family: var(--font-sans);">
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Encabezado final integrado en la ventana de FocusGuard</h2>

<div style="background: var(--surface-1); border-radius: 12px; padding: 10px;">
  <div style="background: var(--surface-2); border:0.5px solid var(--border); border-radius:8px; overflow:hidden;">

    <div style="display:flex;align-items:stretch;height:38px;border-bottom:0.5px solid var(--border);">
      <div style="flex:1;display:flex;align-items:center;gap:8px;padding-left:14px;">
        <span style="width:16px;height:16px;border-radius:4px;background:var(--fill-accent);display:inline-block;"></span>
        <span style="font-size:12px;color:var(--text-secondary);">FocusGuard</span>
      </div>
      <div style="display:flex;">
        <span style="width:46px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);"><i class="ti ti-minus" style="font-size:14px" aria-hidden="true"></i></span>
        <span style="width:46px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);"><i class="ti ti-square" style="font-size:12px" aria-hidden="true"></i></span>
        <span style="width:46px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);"><i class="ti ti-x" style="font-size:15px" aria-hidden="true"></i></span>
      </div>
    </div>

    <div style="display:flex;min-height:340px;">
      <div style="width:180px;border-right:0.5px solid var(--border);padding:12px 10px;display:flex;flex-direction:column;gap:2px;">
        <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);background:var(--bg-accent);font-size:13px;font-weight:500;color:var(--text-accent);position:relative;">
          <span style="position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--fill-accent);"></span>
          <i class="ti ti-target" style="font-size:17px" aria-hidden="true"></i>Enfoque</div>
        <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);color:var(--text-secondary);font-size:13px;"><i class="ti ti-layout-grid" style="font-size:17px" aria-hidden="true"></i>Perfiles</div>
        <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);color:var(--text-secondary);font-size:13px;"><i class="ti ti-calendar" style="font-size:17px" aria-hidden="true"></i>Horarios</div>
        <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);color:var(--text-secondary);font-size:13px;"><i class="ti ti-chart-bar" style="font-size:17px" aria-hidden="true"></i>Actividad</div>
        <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);color:var(--text-secondary);font-size:13px;"><i class="ti ti-settings" style="font-size:17px" aria-hidden="true"></i>Ajustes</div>
      </div>

      <div style="flex:1;min-width:0;">

        <div style="display:flex;align-items:stretch;border-bottom:0.5px solid var(--border);">
          <div style="width:5px;background:var(--fill-accent);flex-shrink:0;"></div>
          <div style="flex:1;padding:20px 22px;min-width:0;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;">

              <div style="min-width:0;">
                <div style="display:flex;align-items:center;gap:7px;">
                  <p style="margin:0;font-size:25px;font-weight:500;letter-spacing:-0.02em;line-height:1.15;">Deep Work</p>
                  <i class="ti ti-selector" style="font-size:17px;color:var(--text-muted)" aria-hidden="true"></i>
                </div>
                <p style="margin:6px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.5;">Nada de redes ni chats. 7 sitios y 4 apps fuera de alcance.</p>
                <div style="display:flex;gap:5px;margin-top:12px;">
                  <span style="width:24px;height:24px;border-radius:7px;background:var(--fill-accent);"></span>
                  <span style="width:24px;height:24px;border-radius:7px;background:var(--fill-control);"></span>
                  <span style="width:24px;height:24px;border-radius:7px;background:var(--fill-control);"></span>
                  <span style="width:24px;height:24px;border-radius:7px;border:0.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-muted);"><i class="ti ti-plus" style="font-size:12px" aria-hidden="true"></i></span>
                </div>
              </div>

              <div style="text-align:right;flex-shrink:0;">
                <p style="margin:0;font-size:30px;font-weight:300;letter-spacing:-0.02em;line-height:1;">2<span style="font-size:16px;font-weight:400;color:var(--text-secondary);">h</span> 18<span style="font-size:16px;font-weight:400;color:var(--text-secondary);">m</span></p>
                <p style="margin:4px 0 0;font-size:11px;color:var(--text-muted);letter-spacing:0.04em;">ENFOCADO HOY</p>
                <div style="display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:10px;justify-content:flex-end;">
                  <span style="width:7px;height:40%;background:var(--fill-control);border-radius:2px 2px 0 0;"></span>
                  <span style="width:7px;height:65%;background:var(--fill-control);border-radius:2px 2px 0 0;"></span>
                  <span style="width:7px;height:30%;background:var(--fill-control);border-radius:2px 2px 0 0;"></span>
                  <span style="width:7px;height:80%;background:var(--fill-control);border-radius:2px 2px 0 0;"></span>
                  <span style="width:7px;height:55%;background:var(--fill-control);border-radius:2px 2px 0 0;"></span>
                  <span style="width:7px;height:70%;background:var(--fill-control);border-radius:2px 2px 0 0;"></span>
                  <span style="width:7px;height:100%;background:var(--fill-accent);border-radius:2px 2px 0 0;"></span>
                </div>
              </div>

            </div>
          </div>
        </div>

        <div style="padding:16px 22px;">
          <div style="background:var(--surface-1);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:18px;">
            <div style="width:82px;height:82px;border-radius:50%;border:3px solid var(--border-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;">
              <span style="font-size:20px;font-weight:500;">50</span>
              <span style="font-size:10px;color:var(--text-secondary);">minutos</span>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;gap:6px;margin-bottom:9px;">
                <span style="font-size:12px;padding:5px 11px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent);">50 m</span>
                <span style="font-size:12px;padding:5px 11px;border-radius:var(--radius);border:0.5px solid var(--border);color:var(--text-secondary);">25 m</span>
                <span style="font-size:12px;padding:5px 11px;border-radius:var(--radius);border:0.5px solid var(--border);color:var(--text-secondary);">90 m</span>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-secondary);padding:6px 0;border-top:0.5px solid var(--border);">
                <span><i class="ti ti-shield-check" style="font-size:15px;vertical-align:-3px;margin-right:5px" aria-hidden="true"></i>Bloqueo real de apps y sitios</span>
                <span style="width:32px;height:18px;border-radius:999px;background:var(--fill-accent);position:relative;"><span style="position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;"></span></span>
              </div>
            </div>
            <button style="background:var(--fill-accent);color:var(--on-accent);border:none;font-size:13px;padding:11px 22px;border-radius:var(--radius);flex-shrink:0;">Iniciar</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</div>
